# Набор традиций для толкования снов.
# Можно добавлять, убирать и менять описания — код править не нужно.
# label — как традиция подписана в ответе бота, button — надпись на кнопке выбора сонника.
#
# Человек может сам выбрать сонники (не больше pick_dream_books) командой /sonnik.
# Если не выбрал — бот для каждого сна берёт случайные. Психологические подходы
# всегда случайные. Сколько традиций брать для одного сна — задаётся здесь:
pick_dream_books: 3
pick_psychology: 3

dream_books:
  - name: Миллер
    button: "Миллер"
    label: "Миллер"
    description: >-
      Самый известный сонник. Толкует сон через жизненные события:
      удача и неудача, отношения, деньги, работа.

  - name: Цветков
    button: "Цветков"
    label: "Цветков"
    description: >-
      Современный русскоязычный сонник, хорошо работает с бытовыми
      и актуальными образами (телефон, машина, офис, соцсети).

  - name: Ванга
    button: "Ванга"
    label: "Традиция Ванги"
    description: >-
      Народный, предостерегающе-пророческий стиль. Авторство приписное,
      поэтому всегда говори только «в традиции Ванги», никогда «Ванга пишет».

  - name: Лофф
    button: "Лофф"
    label: "Лофф"
    description: >-
      Сонник Дэвида Лоффа. Подчёркивает личные ассоциации: один и тот же
      образ значит разное для разных людей, важно, что он значит именно для сновидца.

  - name: Нострадамус
    button: "Нострадамус"
    label: "Традиция Нострадамуса"
    description: >-
      Мистический, масштабный стиль: образы как знаки судьбы и больших перемен.
      Авторство приписное, поэтому говори только «в традиции Нострадамуса».

  - name: мисс Хассе
    button: "Мисс Хассе"
    label: "Мисс Хассе"
    description: >-
      Старинный салонный сонник: короткие, бытовые трактовки
      «к хлопотам», «к радостным вестям», «к переменам в доме».

  - name: Чжоу-гун
    button: "Чжоу-гун (Китай)"
    label: "Китайский сонник Чжоу-гуна"
    description: >-
      Древнекитайская традиция толкования снов: образы как знаки гармонии
      или её нарушения, благополучия семьи, удачи в делах.

  - name: народные приметы
    button: "Народные приметы"
    label: "Народные приметы"
    description: >-
      Славянские народные толкования: «к деньгам», «к гостям», «к дороге»,
      «к перемене погоды» — просто и образно.

psychology:
  - name: Фрейд
    label: "Фрейд"
    description: >-
      Желания, вытесненные переживания, отношения с близкими.

  - name: Юнг
    label: "Юнг"
    description: >-
      Архетипы, символы, компенсация односторонности сознания.

  - name: Холл
    label: "Холл"
    description: >-
      Когнитивный подход: сон отражает текущие заботы человека и его
      представления о себе и других. «Заземляющая» линза.

  - name: Перлз
    label: "Гештальт (Перлз)"
    description: >-
      Гештальт-терапия Фрица Перлза: каждый персонаж и предмет сна — это
      часть самого сновидца, его непрожитые чувства и стороны личности.

  - name: Адлер
    label: "Адлер"
    description: >-
      Индивидуальная психология: сон как репетиция решения текущих жизненных
      задач, отражает настрой, ощущение собственной силы или слабости.

  - name: Ревонсуо
    label: "Ревонсуо (симуляция угроз)"
    description: >-
      Эволюционный взгляд Антти Ревонсуо: тревожные сны — тренировка мозга,
      который репетирует реакцию на опасности и стрессовые ситуации.
